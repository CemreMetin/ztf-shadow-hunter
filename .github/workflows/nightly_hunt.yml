name: Nightly ZTF Shadow & Blindspot Hunter

on:
  schedule:
    # Her gece 03:17 UTC (06:17 TR) — saat basi kuyruk yogunlugundan kacinmak icin kusuratli dakika
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-worker.txt

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Run Nightly Shadow & Blindspot Scan
        run: python -m pipeline.worker

      - name: Commit nightly batch and byproducts
        run: |
          git config --global user.name "ZTF Shadow Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/ pending_candidates/
          if ! git diff --cached --quiet; then
            git commit -m "chore: nightly ZTF shadow & blindspot batch [skip ci]"
            git pull --rebase
            git push
          fi
